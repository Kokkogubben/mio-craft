[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core of MioCraft: Minecraft installs, launching, mod projects and the local control API"

[lib]
name = "launcher_core"
path = "src/lib.rs"

[[bin]]
name = "launcher-headless"
path = "src/bin/headless.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query"] }
dirs = "6"
flate2 = "1"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
hex = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3"
