name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix ui && npm ci --prefix mcp
      - name: Core tests
        run: cargo test -p launcher-core
      - name: UI typecheck
        run: npm run typecheck --prefix ui
      - name: MCP server build
        run: npm run build --prefix mcp

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # attach the installer to a release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm ci --prefix ui && npm ci --prefix mcp
      - name: Build installer
        shell: bash
        env:
          # Signs the installer so installed copies can verify updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run build
          else
            # Pull requests from forks have no signing key: build without update files.
            npm run build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mio-craft-windows
          path: target/release/bundle/nsis/*.exe
      - name: Write update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/update-manifest.mjs
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/latest.json

  # macOS and Linux: test files only, never attached to a release or listed in
  # latest.json until they have been tried on real machines. Unsigned.
  macos:
    needs: test
    if: ${{ !startsWith(github.ref, refs/tags/) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm ci --prefix ui && npm ci --prefix mcp
      - name: Build app (Apple silicon and Intel)
        run: npm run build -- --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: mio-craft-macos-untested
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14

  linux:
    needs: test
    if: ${{ !startsWith(github.ref, refs/tags/) }}
    # The oldest supported runner, so the files run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm ci && npm ci --prefix ui && npm ci --prefix mcp
      - name: Build AppImage and .deb
        run: npm run build -- --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: mio-craft-linux-untested
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          retention-days: 14
